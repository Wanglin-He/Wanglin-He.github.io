<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wanglin He</title>
  <meta name="description" content="Wanglin He — M.S. student in Mechanical Engineering at Columbia University, working on robot hardware, robot learning and simulation.">
  <meta property="og:title" content="Wanglin He">
  <meta property="og:description" content="M.S. Student in Mechanical Engineering at Columbia University. Robot hardware, robot learning and simulation.">
  <meta property="og:image" content="https://wanglin-he.github.io/images/portrait.jpg">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="light">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a6fdb'/%3E%3Cpath d='M15 21l7 23 10-17 10 17 7-23' fill='none' stroke='white' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400&display=swap" rel="stylesheet">
  <script defer src="content.js"></script>
  <script defer src="render.js"></script>
  <style>
    :root {
      --heading: #1c1e21;
      --text: #3b3f45;
      --muted: #6a7078;
      --faint: #8d939a;
      --line: #e7e9ec;
      --accent: #2a6fdb;
      --accent-soft: #eef3fc;
      --award: #d4382c;
      --nav-h: 64px;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: #fff;
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: .2em; }
    strong { color: var(--heading); font-weight: 600; }
    h1, h2, h3 { color: var(--heading); margin: 0; }
    img { max-width: 100%; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

    /* 顶部导航 */
    .site-nav {
      position: sticky; top: 0; z-index: 10;
      background: rgba(255, 255, 255, .92);
      -webkit-backdrop-filter: saturate(180%) blur(10px); backdrop-filter: saturate(180%) blur(10px);
      border-bottom: 1px solid var(--line);
    }
    .nav-inner {
      width: min(1120px, 100% - 48px); margin: 0 auto; height: var(--nav-h);
      display: flex; align-items: center; justify-content: space-between; gap: 32px;
    }
    .brand { color: var(--heading); font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
    .brand:hover { text-decoration: none; }
    .nav-links { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .nav-links::-webkit-scrollbar { display: none; }
    .nav-links a {
      position: relative; padding: 0 14px; line-height: var(--nav-h); white-space: nowrap;
      color: var(--heading); font-size: .97rem; font-weight: 500;
    }
    .nav-links a:hover { color: var(--accent); text-decoration: none; }
    .nav-links a.active { color: var(--accent); }
    .nav-links a.active::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent);
    }

    main { width: min(960px, 100% - 48px); margin: 0 auto; }

    /* 个人信息 */
    .hero {
      display: grid; grid-template-columns: minmax(0, 1fr) 240px; column-gap: 56px;
      padding: 72px 0 8px; align-items: center;
    }
    .hero h1 { font-size: 3rem; line-height: 1.1; font-weight: 700; letter-spacing: -.025em; }
    .tagline { margin: 14px 0 0; color: var(--muted); font-size: 1.2rem; font-weight: 500; }
    .location { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; color: var(--faint); font-size: 1rem; }
    .location .icon { width: 17px; height: 17px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
    .button {
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 18px;
      border: 1px solid #dcdfe3; border-radius: 10px; background: #fff;
      color: var(--heading); font-size: .97rem; font-weight: 500;
      transition: border-color .15s ease, color .15s ease, background .15s ease;
    }
    .button:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); text-decoration: none; }
    .button .icon { width: 18px; height: 18px; }
    .portrait { width: 240px; height: 240px; border-radius: 50%; object-fit: cover; display: block; }
    .bio { grid-column: 1 / -1; margin-top: 36px; font-size: 1.1rem; line-height: 1.8; }
    .bio p { margin: 0 0 18px; }

    .icon { display: inline-flex; flex: none; }
    .icon svg { width: 100%; height: 100%; }

    /* 板块 */
    .section { padding-top: 64px; scroll-margin-top: calc(var(--nav-h) + 8px); }
    .section h2 {
      display: inline-block; font-size: 2rem; line-height: 1.2; font-weight: 700; letter-spacing: -.02em;
      padding-bottom: 12px; border-bottom: 3px solid var(--accent); margin-bottom: 8px;
    }
    .section-intro { margin: 14px 0 0; color: var(--muted); font-size: 1.05rem; }

    .cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; margin-top: 28px; }
    .card { padding: 26px 24px 24px; border: 1px solid var(--line); border-radius: 14px; }
    .card > .icon {
      width: 44px; height: 44px; padding: 11px; border-radius: 10px;
      background: var(--accent-soft); color: var(--accent);
    }
    .card h3 { margin-top: 20px; font-size: 1.1rem; line-height: 1.4; font-weight: 600; }
    .card p { margin: 10px 0 0; color: var(--muted); font-size: .95rem; line-height: 1.65; }

    .entry {
      display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 32px; align-items: start;
      padding: 30px 0; border-bottom: 1px solid var(--line);
    }
    .section h2 + .entry, .section-intro + .entry { margin-top: 12px; }
    .entry:last-child { border-bottom: 0; padding-bottom: 8px; }
    .entry.no-image .entry-body { grid-column: 2; }
    .thumb {
      display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; object-fit: cover;
      border: 1px solid var(--line); border-radius: 10px; background: #f6f7f8;
    }
    .entry h3 { font-size: 1.2rem; line-height: 1.45; font-weight: 600; letter-spacing: -.01em; }
    .authors, .context { margin: 8px 0 0; color: var(--muted); font-size: 1rem; line-height: 1.6; }
    .venue { margin: 8px 0 0; color: var(--heading); font-size: 1rem; font-weight: 600; }
    .highlight { color: var(--award); white-space: nowrap; }
    .highlight .icon { display: inline-block; width: 17px; height: 17px; margin-right: 4px; vertical-align: -3px; }
    .summary { margin: 10px 0 0; font-size: 1rem; line-height: 1.7; }
    .item-links { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 12px; font-weight: 500; }

    .rows { margin-top: 16px; }
    .row {
      display: grid; grid-template-columns: 40% minmax(0, 1fr); gap: 24px;
      padding: 15px 0; border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .row-label { color: var(--heading); font-weight: 600; }
    .row-text { color: var(--muted); font-style: italic; }

    footer {
      width: min(960px, 100% - 48px); margin: 72px auto 0; padding: 28px 0 44px;
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      border-top: 1px solid var(--line); color: var(--faint); font-size: .9rem;
    }
    footer a { color: var(--muted); }

    @media (max-width: 860px) {
      .cards { grid-template-columns: 1fr; gap: 14px; }
      .card { display: grid; grid-template-columns: 44px minmax(0, 1fr); column-gap: 16px; padding: 20px; }
      .card > .icon { grid-row: span 2; }
      .card h3 { margin-top: 0; }
      .card p { margin-top: 4px; }
    }
    @media (max-width: 720px) {
      :root { --nav-h: 54px; }
      body { font-size: 16px; }
      .nav-inner { width: 100%; padding-left: 16px; gap: 12px; }
      .brand { font-size: 1.02rem; }
      .nav-links { -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); mask-image: linear-gradient(90deg, #000 85%, transparent); padding-right: 24px; }
      .nav-links a { padding: 0 10px; font-size: .92rem; }
      main, footer { width: calc(100% - 32px); }
      .hero { grid-template-columns: 1fr; padding-top: 36px; }
      .portrait { grid-row: 1; width: 132px; height: 132px; margin-bottom: 22px; }
      .hero h1 { font-size: 2.3rem; }
      .tagline { font-size: 1.05rem; margin-top: 10px; }
      .buttons { gap: 6px; margin-top: 20px; }
      .button { gap: 5px; padding: 6px 10px; font-size: .86rem; border-radius: 9px; }
      .button .icon { width: 15px; height: 15px; }
      .bio { font-size: 1.02rem; margin-top: 28px; }
      .section { padding-top: 48px; }
      .section h2 { font-size: 1.65rem; }
      .entry { grid-template-columns: 1fr; gap: 16px; padding: 26px 0; }
      .entry.no-image .entry-body { grid-column: auto; }
      .row { grid-template-columns: 1fr; gap: 2px; padding: 13px 0; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
  </style>
</head>
<body id="top">
  <header class="site-nav">
    <nav class="nav-inner" aria-label="Main">
      <a class="brand" href="#top">Wanglin He</a>
      <div class="nav-links"></div>
    </nav>
  </header>
  <main>
    <noscript><p style="padding:64px 0">Wanglin He — M.S. Student in Mechanical Engineering, Columbia University. Please enable JavaScript to view this page, or see the <a href="cv.pdf">CV</a>.</p></noscript>
  </main>
  <footer></footer>
</body>
</html>
